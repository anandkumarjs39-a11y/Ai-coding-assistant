<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AI Coding Assistant</title>
    <meta name="description" content="Create an account on AI Coding Assistant." />

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Project Stylesheets -->
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <div class="auth-page-wrapper">
      <div class="auth-card" style="max-width: 480px;">
        <!-- Brand Header -->
        <div class="auth-header">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
            <div class="brand-logo-icon"><i class="bi bi-cpu"></i></div>
            <span class="fs-5 fw-bold" style="color: var(--text-primary);">AI Coding Assistant</span>
          </a>
          <h1 class="fs-5 fw-bold mb-1">Create Developer Account</h1>
          <p class="small text-muted mb-0">Register your profile for academic project demonstration</p>
        </div>

        <!-- Alert Banner -->
        <div id="register-alert-box" class="alert d-none small py-2" role="alert"></div>

        <!-- Registration Form -->
        <form id="register-form" novalidate>
          <div class="mb-3">
            <label for="reg-name" class="form-label-custom">Full Name</label>
            <input 
              type="text" 
              class="form-control-custom" 
              id="reg-name" 
              placeholder="e.g. Alex Chen" 
              required 
            />
          </div>

          <div class="mb-3">
            <label for="reg-email" class="form-label-custom">College / University Email</label>
            <input 
              type="email" 
              class="form-control-custom" 
              id="reg-email" 
              placeholder="student@university.edu" 
              required 
            />
          </div>

          <div class="mb-3">
            <label for="reg-password" class="form-label-custom">Create Password</label>
            <div class="password-input-group">
              <input 
                type="password" 
                class="form-control-custom" 
                id="reg-password" 
                placeholder="Minimum 8 characters" 
                required 
              />
              <button type="button" class="password-toggle-btn" id="toggle-reg-pass-btn">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <!-- Password Requirements Checklist -->
            <div class="mt-2 p-2 rounded small" style="background: var(--bg-surface-subtle); border: 1px solid var(--border-color); font-size: 0.75rem;">
              <div class="text-muted mb-1 fw-semibold">Password Requirements:</div>
              <div id="rule-length" class="text-muted"><i class="bi bi-circle me-1"></i>At least 8 characters</div>
              <div id="rule-number" class="text-muted"><i class="bi bi-circle me-1"></i>At least one number (0-9)</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="reg-confirm-password" class="form-label-custom">Confirm Password</label>
            <input 
              type="password" 
              class="form-control-custom" 
              id="reg-confirm-password" 
              placeholder="Re-enter password" 
              required 
            />
            <div id="pass-match-error" class="text-danger small mt-1 d-none">Passwords do not match.</div>
          </div>

          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="terms-agree" required checked>
              <label class="form-check-label small text-muted" for="terms-agree">
                I agree to the academic demonstration terms and workspace code of conduct.
              </label>
            </div>
          </div>

          <button type="submit" id="btn-register-submit" class="btn-primary-action w-100 py-2">
            <span id="btn-register-text"><i class="bi bi-person-check me-1"></i> Complete Registration</span>
            <span id="btn-register-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted" style="border-color: var(--border-color) !important;">
          Already have an account? <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign in</a>
          <div class="mt-2">
            <a href="workspace.html" class="text-secondary text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Continue to Workspace directly
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/ui.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const passInput = document.getElementById('reg-password');
        const confirmInput = document.getElementById('reg-confirm-password');
        const toggleBtn = document.getElementById('toggle-reg-pass-btn');

        toggleBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          toggleBtn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });

        // Real-time password check
        passInput.addEventListener('input', () => {
          const val = passInput.value;
          const ruleLength = document.getElementById('rule-length');
          const ruleNumber = document.getElementById('rule-number');

          if (val.length >= 8) {
            ruleLength.className = 'text-success fw-semibold';
            ruleLength.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>At least 8 characters';
          } else {
            ruleLength.className = 'text-muted';
            ruleLength.innerHTML = '<i class="bi bi-circle me-1"></i>At least 8 characters';
          }

          if (/\d/.test(val)) {
            ruleNumber.className = 'text-success fw-semibold';
            ruleNumber.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>At least one number (0-9)';
          } else {
            ruleNumber.className = 'text-muted';
            ruleNumber.innerHTML = '<i class="bi bi-circle me-1"></i>At least one number (0-9)';
          }
        });

        const form = document.getElementById('register-form');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('reg-name').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          const password = passInput.value;
          const confirmPassword = confirmInput.value;

          const matchError = document.getElementById('pass-match-error');
          if (password !== confirmPassword) {
            matchError.classList.remove('d-none');
            return;
          } else {
            matchError.classList.add('d-none');
          }

          if (password.length < 8) {
            showAlert('Password must contain at least 8 characters.', 'danger');
            return;
          }

          setLoading(true);
          clearAlert();

          try {
            await Auth.register(name, email, password);
            showAlert('Registration completed! Redirecting to login...', 'success');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);
          } catch (err) {
            showAlert(err.message || 'Registration failed. Email may already be registered.', 'danger');
            setLoading(false);
          }
        });

        function showAlert(msg, type = 'danger') {
          const box = document.getElementById('register-alert-box');
          box.className = `alert alert-${type} small py-2`;
          box.textContent = msg;
          box.classList.remove('d-none');
        }

        function clearAlert() {
          const box = document.getElementById('register-alert-box');
          box.classList.add('d-none');
        }

        function setLoading(isLoading) {
          const btn = document.getElementById('btn-register-submit');
          const txt = document.getElementById('btn-register-text');
          const spin = document.getElementById('btn-register-spinner');
          btn.disabled = isLoading;
          if (isLoading) {
            txt.classList.add('d-none');
            spin.classList.remove('d-none');
          } else {
            txt.classList.remove('d-none');
            spin.classList.add('d-none');
          }
        }
      });
    </script>
  </body>
</html>
