<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - AI Coding Assistant</title>
    <meta name="description" content="Reset your password via email verification." />

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Project Stylesheets -->
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <div class="auth-page-wrapper">
      <div class="auth-card">
        <!-- Brand Header -->
        <div class="auth-header">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
            <div class="brand-logo-icon"><i class="bi bi-cpu"></i></div>
            <span class="fs-5 fw-bold" style="color: var(--text-primary);">AI Coding Assistant</span>
          </a>
          <h1 class="fs-5 fw-bold mb-1" id="reset-title">Reset Password</h1>
          <p class="small text-muted mb-0" id="reset-desc">Enter your email to receive a password reset link</p>
        </div>

        <!-- Alert Banner -->
        <div id="auth-alert-box" class="alert d-none small py-2" role="alert"></div>

        <!-- Step 1: Email Form -->
        <form id="email-form" novalidate>
          <div class="mb-3">
            <label for="reset-email" class="form-label-custom">College Email Address</label>
            <input 
              type="email" 
              class="form-control-custom" 
              id="reset-email" 
              placeholder="alex.chen@university.edu" 
              required 
              autocomplete="email"
            />
          </div>

          <button type="submit" id="btn-send-reset" class="btn-primary-action w-100 py-2">
            <span id="btn-send-text"><i class="bi bi-envelope me-1"></i> Send Reset Link</span>
            <span id="btn-send-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Step 2: Token + Password Form (hidden initially) -->
        <form id="token-form" class="d-none" novalidate>
          <div class="mb-3">
            <label for="reset-token" class="form-label-custom">Reset Verification Code</label>
            <div class="input-group">
              <input 
                type="text" 
                class="form-control-custom" 
                id="reset-token" 
                placeholder="Enter code from email" 
                required
              />
              <button type="button" id="btn-resend-token" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-counterclockwise"></i> Resend
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="reset-password" class="form-label-custom">New Password</label>
            <div class="password-input-group">
              <input 
                type="password" 
                class="form-control-custom" 
                id="reset-password" 
                placeholder="Enter new password" 
                required
                minlength="6"
              />
              <button type="button" class="password-toggle-btn" id="toggle-reset-password" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label for="reset-password-confirm" class="form-label-custom">Confirm New Password</label>
            <div class="password-input-group">
              <input 
                type="password" 
                class="form-control-custom" 
                id="reset-password-confirm" 
                placeholder="Confirm new password" 
                required
                minlength="6"
              />
              <button type="button" class="password-toggle-btn" id="toggle-reset-password-confirm" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-reset-submit" class="btn-primary-action w-100 py-2">
            <span id="btn-reset-text"><i class="bi bi-key me-1"></i> Reset Password</span>
            <span id="btn-reset-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Success Message (hidden initially) -->
        <div id="success-view" class="text-center d-none">
          <div class="saas-card p-4">
            <i class="bi bi-check-circle-fill fs-1 text-success mb-3"></i>
            <h3 class="fs-6 fw-bold mb-2">Password Reset Complete!</h3>
            <p class="small text-muted mb-4">Your password has been updated successfully.</p>
            <a href="login.html" class="btn btn-primary-action py-2 px-4">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Now
            </a>
          </div>
        </div>

        <div class="mt-3 text-center">
          <a href="login.html" class="small text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Back to Login
          </a>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/ui.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        
        let currentToken = '';
        
        // If token is in URL (from email link), skip to password reset form
        if (tokenFromUrl) {
          currentToken = tokenFromUrl;
          document.getElementById('reset-token').value = tokenFromUrl;
          showTokenForm();
        }

        // Email form submission
        document.getElementById('email-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('reset-email').value.trim();
          
          if (!email) {
            showAlert('Please enter your email address.', 'danger');
            return;
          }
          
          setLoading('btn-send-reset', true);
          clearAlert();
          
          try {
            const res = await API.forgotPassword(email, window.location.origin);
            
            if (res.demo_token) {
              currentToken = res.demo_token;
              document.getElementById('reset-token').value = res.demo_token;
              showAlert('Demo token generated: ' + res.demo_token.substring(0, 20) + '... Enter the full code below.', 'info');
            } else {
              showAlert('Reset link sent to your email.', 'success');
            }
            
            showTokenForm();
          } catch (err) {
            showAlert(err.message || 'Failed to send reset email. Check backend server.', 'danger');
          } finally {
            setLoading('btn-send-reset', false);
          }
        });

        // Token form submission
        document.getElementById('token-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const token = document.getElementById('reset-token').value.trim() || currentToken;
          const newPassword = document.getElementById('reset-password').value;
          const confirmPassword = document.getElementById('reset-password-confirm').value;
          
          if (!token || !newPassword) {
            showAlert('Please enter the verification code and new password.', 'danger');
            return;
          }
          
          if (newPassword !== confirmPassword) {
            showAlert('Passwords do not match.', 'danger');
            return;
          }
          
          setLoading('btn-reset-submit', true);
          clearAlert();
          
          try {
            await API.resetPassword(token, newPassword);
            showSuccess();
          } catch (err) {
            showAlert(err.message || 'Reset failed. Token may have expired.', 'danger');
            setLoading('btn-reset-submit', false);
          }
        });

        // Resend token
        document.getElementById('btn-resend-token').addEventListener('click', async () => {
          const email = document.getElementById('reset-email').value.trim();
          if (!email) {
            showAlert('Please enter your email first.', 'danger');
            return;
          }
          
          try {
            const res = await API.forgotPassword(email, window.location.origin);
            if (res.demo_token) {
              currentToken = res.demo_token;
              document.getElementById('reset-token').value = res.demo_token;
              showAlert('New demo token generated: ' + res.demo_token, 'info');
            } else {
              showAlert('New reset link sent to your email.', 'success');
            }
          } catch (err) {
            showAlert('Failed to resend. Try again.', 'danger');
          }
        });

        // Password visibility toggles
        const toggleBtns = document.querySelectorAll('.password-toggle-btn');
        toggleBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const input = btn.closest('.password-input-group').querySelector('input');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
          });
        });

        function showTokenForm() {
          document.getElementById('email-form').classList.add('d-none');
          document.getElementById('token-form').classList.remove('d-none');
          document.getElementById('reset-title').textContent = 'Enter Reset Code';
          document.getElementById('reset-desc').textContent = 'Check your email and enter the verification code';
        }

        function showSuccess() {
          document.getElementById('email-form').classList.add('d-none');
          document.getElementById('token-form').classList.add('d-none');
          document.getElementById('success-view').classList.remove('d-none');
        }

        function showAlert(msg, type = 'danger') {
          const box = document.getElementById('auth-alert-box');
          box.className = `alert alert-${type} small py-2`;
          box.textContent = msg;
          box.classList.remove('d-none');
        }

        function clearAlert() {
          const box = document.getElementById('auth-alert-box');
          box.classList.add('d-none');
        }

        function setLoading(btnId, isLoading) {
          const btn = document.getElementById(btnId);
          const txt = btn.querySelector('[id^="btn-"][id$="-text"]');
          const spin = btn.querySelector('.spinner-border');
          btn.disabled = isLoading;
          if (isLoading) {
            txt.classList.add('d-none');
            spin.classList.remove('d-none');
          } else {
            txt.classList.remove('d-none');
            spin.classList.add('d-none');
          }
        }
      });
    </script>
  </body>
</html>
