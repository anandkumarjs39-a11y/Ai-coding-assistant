<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AI Coding Assistant</title>
    <meta name="description" content="Sign in to AI Coding Assistant developer workspace." />

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Project Stylesheets -->
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <div class="auth-page-wrapper">
      <div class="auth-card">
        <!-- Brand Header -->
        <div class="auth-header">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
            <div class="brand-logo-icon"><i class="bi bi-cpu"></i></div>
            <span class="fs-5 fw-bold" style="color: var(--text-primary);">AI Coding Assistant</span>
          </a>
          <h1 class="fs-5 fw-bold mb-1">Developer Sign In</h1>
          <p class="small text-muted mb-0">Sign in to access your AI coding workspace & conversation history</p>
        </div>

        <!-- Alert Banner -->
        <div id="auth-alert-box" class="alert d-none small py-2" role="alert"></div>

        <!-- Login Form -->
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="login-email" class="form-label-custom">College Email or Username</label>
            <input 
              type="email" 
              class="form-control-custom" 
              id="login-email" 
              placeholder="alex.chen@university.edu" 
              required 
              autocomplete="email"
            />
            <div class="invalid-feedback small">Please provide a valid email address.</div>
          </div>

          <div class="mb-3">
            <div class="d-flex align-items-center justify-content-between mb-1">
              <label for="login-password" class="form-label-custom mb-0">Password</label>
              <a href="reset-password.html" class="small text-muted text-decoration-none">Forgot?</a>
            </div>
            <div class="password-input-group">
              <input 
                type="password" 
                class="form-control-custom" 
                id="login-password" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback small">Password is required.</div>
          </div>

          <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember-me" checked>
              <label class="form-check-label small text-muted" for="remember-me">
                Remember session
              </label>
            </div>
          </div>

          <button type="submit" id="btn-login-submit" class="btn-primary-action w-100 py-2">
            <span id="btn-login-text"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Workspace</span>
            <span id="btn-login-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Examiner Quick Fill Demo Helper -->
        <div class="mt-3 text-center">
          <button type="button" id="btn-quick-demo" class="btn btn-sm btn-link text-decoration-none small text-muted">
            <i class="bi bi-magic me-1"></i> Quick Fill Viva Demo Credentials
          </button>
        </div>

        <div class="mt-4 pt-3 border-top text-center small text-muted" style="border-color: var(--border-color) !important;">
          Don't have an account? <a href="register.html" class="fw-semibold text-primary text-decoration-none">Create account</a>
          <div class="mt-2">
            <a href="workspace.html" class="text-secondary text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Return to Workspace directly
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/ui.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Show/Hide password toggle
        const toggleBtn = document.getElementById('toggle-password-btn');
        const passInput = document.getElementById('login-password');
        if (toggleBtn && passInput) {
          toggleBtn.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
          });
        }

        // Quick demo fill
        const btnDemo = document.getElementById('btn-quick-demo');
        if (btnDemo) {
          btnDemo.addEventListener('click', () => {
            document.getElementById('login-email').value = 'alex.chen@university.edu';
            document.getElementById('login-password').value = 'SeniorProject2026!';
            UI.showToast('Demo credentials populated', 'info');
          });
        }

        // Check URL params for expired message
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('expired')) {
          showAlert('Your previous session expired. Please sign in again.', 'warning');
        }

        // Form submission
        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value.trim();
          const password = passInput.value;

          if (!email || !password) {
            showAlert('Please provide both email and password.', 'danger');
            return;
          }

          setLoading(true);
          clearAlert();

          try {
            await Auth.login(email, password);
            UI.showToast('Authentication successful!', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 500);
          } catch (err) {
            showAlert(err.message || 'Login failed. Please check credentials or backend server.', 'danger');
            setLoading(false);
          }
        });

        function showAlert(msg, type = 'danger') {
          const box = document.getElementById('auth-alert-box');
          box.className = `alert alert-${type} small py-2`;
          box.textContent = msg;
          box.classList.remove('d-none');
        }

        function clearAlert() {
          const box = document.getElementById('auth-alert-box');
          box.classList.add('d-none');
        }

        function setLoading(isLoading) {
          const btn = document.getElementById('btn-login-submit');
          const txt = document.getElementById('btn-login-text');
          const spin = document.getElementById('btn-login-spinner');
          btn.disabled = isLoading;
          if (isLoading) {
            txt.classList.add('d-none');
            spin.classList.remove('d-none');
          } else {
            txt.classList.remove('d-none');
            spin.classList.add('d-none');
          }
        }
      });
    </script>
  </body>
</html>
