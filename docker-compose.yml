version: '3.8'

services:
  # PostgreSQL Database (Production)
  db:
    image: postgres:15-alpine
    container_name: ai-assistant-db
    environment:
      POSTGRES_DB: ai_coding_assistant
      POSTGRES_USER: ${DB_USER:-ai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_user} -d ai_coding_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-assistant-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ai_user}:${DB_PASSWORD:-secure_password_change_me}@db:5432/ai_coding_assistant
      PORT: 5000
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-network
    restart: unless-stopped

  # Frontend (Nginx for production)
  frontend:
    image: nginx:alpine
    container_name: ai-assistant-frontend
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ai-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ai-network:
    driver: bridge